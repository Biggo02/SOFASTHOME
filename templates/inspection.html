{% extends 'base.html' %}{% block title %}État des lieux — FASTHOME{% endblock %}{% block content %}<section class='form-page'><div class='page-head'><small>OPERATIONS · ÉTAT DES LIEUX</small><h1>{{ visit.property.title }}</h1><p>Visite #{{ visit.pk }} · {{ visit.scheduled_date|date:'d/m/Y' }}</p></div><form method='post' class='form-card'>{% csrf_token %}<div class='field'><label>État général</label><textarea name='condition' rows='5'>{{ inspection.condition }}</textarea></div><div class='field'><label>Relevés des compteurs</label><textarea name='meter_readings' rows='4'>{{ inspection.meter_readings }}</textarea></div><div class='field'><label>Nombre de clés remises</label><input type='number' min='0' name='keys_received' value='{{ inspection.keys_received }}'></div><div class='field'><label>Notes</label><textarea name='notes' rows='4'>{{ inspection.notes }}</textarea></div><label class='check'><input type='checkbox' name='signed_by_tenant' {% if inspection.signed_by_tenant %}checked{% endif %}> Validation locataire</label><label class='check'><input type='checkbox' name='signed_by_agent' {% if inspection.signed_by_agent %}checked{% endif %}> Validation agent FASTHOME</label><div class='form-actions'><a class='btn btn-light' href='{% url "manage_visit" visit.pk %}'>Retour</a><button class='btn btn-primary'>Enregistrer l'état des lieux</button></div></form></section>{% endblock %}
